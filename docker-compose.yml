# Vollteam — local development environment.
# Start:  docker compose up -d db
# Stop:   docker compose down        (add -v to wipe data)
name: vollteam

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vollteam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vollteam}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vollteam} -d ${POSTGRES_DB:-vollteam}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
