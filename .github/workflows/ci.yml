# Vollteam — CI skeleton (Phase 1). Quality gates run before any feature code lands,
# so the pipeline is proven before it has something to break.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Lint (ruff)
        run: ruff check apps/api tests
        working-directory: .

      - name: Type check (mypy)
        run: mypy .
        working-directory: apps/api
