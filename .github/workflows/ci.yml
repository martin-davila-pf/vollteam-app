# Vollteam — CI (Phase 1). Three-job split: fast lint/type, unit tests,
# and integration tests against a real PostgreSQL service container.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project + tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check apps/api tests

      - name: Type check (mypy)
        run: mypy .
        working-directory: apps/api

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: pip install -e "apps/api[dev]"

      - name: Unit + smoke tests (no DB required)
        run: pytest -m "not integration" apps/api

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vollteam
          POSTGRES_PASSWORD: vollteam
          POSTGRES_DB: vollteam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vollteam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://vollteam:vollteam@localhost:5432/vollteam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: pip install -e "apps/api[dev]"

      - name: Integration tests against real PostgreSQL
        run: pytest -m integration apps/api
