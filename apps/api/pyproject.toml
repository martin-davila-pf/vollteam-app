[project]
name = "vollteam-api"
version = "0.1.0"
description = "Vollteam backend API — volleyball game scheduling with capacity-limited roster and FIFO waitlist"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-psycopg2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "ASYNC",# async correctness
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert allowed inside tests (handled per-path below if needed)
    "B008",  # FastAPI Depends-in-defaults is the framework idiom, not a bug
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"alembic/versions/**" = ["E501"]

[tool.setuptools]
packages = ["vollteam_api"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "apps/api"
files = ["apps/api"]
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
addopts = "--strict-markers --strict-config -q"
asyncio_mode = "auto"
pythonpath = ["."]


markers = [
    "integration: tests requiring a real PostgreSQL (docker compose up db)",
    "e2e: browser end-to-end tests",
]

[tool.coverage.run]
source = ["apps/api"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
